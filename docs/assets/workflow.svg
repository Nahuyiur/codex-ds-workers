<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="workflow-title workflow-desc" id="workflow-root">
<title id="workflow-title">Codex leads. DeepSeek executes.</title>
<desc id="workflow-desc">Codex defines independent tasks for two DeepSeek workers and reviews each result against its contract, changes, and checks before integration.</desc>
<defs>
      <style>#workflow-root { color: #2d3142; font-family: 'Geist',Arial,system-ui,sans-serif; }
      #workflow-root .serif { font-family:'Instrument Serif',Georgia,serif }
      #workflow-root .sans { font-family:'Geist',Arial,system-ui,sans-serif }
      #workflow-root .mono { font-family:'Geist Mono',ui-monospace,monospace }</style><marker id="workflow-workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4f5d75" stroke-width="1.4"/></marker></defs>
<rect x="0" y="0" width="1100" height="600" fill="#f5f5f5"/>
<text x="60" y="60" class="mono" fill="#bf4520" font-size="13" letter-spacing="2">CODEX DS WORKERS</text>
<text x="60" y="124" class="serif" fill="#2d3142" font-size="58">Codex leads.</text>
<text x="60" y="184" class="serif" fill="#2d3142" font-size="58">DeepSeek executes.</text>
<text x="60" y="224" class="sans" fill="#4f5d75" font-size="19">Parallel tasks. Explicit checks. Bounded refinement.</text>
<g fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#workflow-workflow-arrow)">
<path d="M324 344 H404"/><path d="M324 456 H404"/>
<path d="M668 344 H760"/><path d="M668 456 H760"/>
</g>
<rect x="60" y="300" width="264" height="200" rx="6" fill="#f9eae5" stroke="#bf4520" stroke-width="1.3"/>
<text x="84" y="332" class="mono" fill="#bf4520" font-size="12" letter-spacing="1.4">PARENT AGENT</text>
<text x="84" y="374" class="sans" fill="#2d3142" font-weight="600" font-size="25">Codex</text>
<text x="84" y="412" class="sans" fill="#4f5d75" font-size="17">Scope + interfaces</text>
<text x="84" y="442" class="sans" fill="#4f5d75" font-size="17">Main work + integration</text>
<rect x="412" y="300" width="256" height="88" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
<text x="436" y="336" class="sans" fill="#2d3142" font-weight="600" font-size="20">DeepSeek · task A</text>
<text x="436" y="364" class="sans" fill="#4f5d75" font-size="16">Isolated workspace</text>
<rect x="412" y="412" width="256" height="88" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
<text x="436" y="448" class="sans" fill="#2d3142" font-weight="600" font-size="20">DeepSeek · task B</text>
<text x="436" y="476" class="sans" fill="#4f5d75" font-size="16">Isolated workspace</text>
<rect x="768" y="300" width="272" height="200" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
<text x="792" y="348" class="sans" fill="#2d3142" font-weight="600" font-size="23">Review + accept</text>
<text x="792" y="390" class="sans" fill="#4f5d75" font-size="17">Contract · diff · checks</text>
<text x="792" y="422" class="sans" fill="#4f5d75" font-size="16">One repair round by default</text>
<text x="792" y="466" class="mono" fill="#bf4520" font-size="12">MERGE AFTER VALIDATION</text>
<path d="M60 540 H1040" fill="none" stroke="#bfc0c0"/>
<text x="60" y="572" class="mono" fill="#5a6580" font-size="13">2 DELEGATED ACTORS MAX</text>
<text x="1040" y="572" class="sans" text-anchor="end" fill="#4f5d75" font-size="15">Escalate hard reasoning to a suitable GPT worker.</text>
</svg>
